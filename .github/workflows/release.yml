name: Create release
run-name: Release build
on: [workflow_dispatch]

env:
  GAME_NAME: ap_gen_tool

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [
          { os: "windows", target: "Windows Desktop" },
          { os: "linux", target: "Linux" }
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Export tools
        uses: appsinacup/action_export_godot_game@main
        with:
          godot-version: 4.7.2-stable
          game-name: ${{ env.GAME_NAME }}
          platform-name: ${{ matrix.platform.target }}

      - name: Run zip script
        working-directory: /export
        run: bash package-${{ matrix.platform.os }}.sh
      
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: ap-gen-tool-${{ matrix.platform.os }}.zip
          archive: false
          path: export/ap-gen-tool-${{ matrix.platform.os }}.zip

